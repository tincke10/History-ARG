<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fondo dark -->
  <rect width="64" height="64" rx="14" fill="#1a1d2e"/>

  <!-- Sol de Mayo -->
  <g transform="translate(32, 32)">
    <!-- Rayos largos (rectos) -->
    <line x1="0" y1="-24" x2="0" y2="-12" stroke="#F6B40E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="12" x2="0" y2="24" stroke="#F6B40E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-24" y1="0" x2="-12" y2="0" stroke="#F6B40E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="0" x2="24" y2="0" stroke="#F6B40E" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rayos diagonales -->
    <line x1="-17" y1="-17" x2="-8.5" y2="-8.5" stroke="#F6B40E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8.5" y1="8.5" x2="17" y2="17" stroke="#F6B40E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="17" y1="-17" x2="8.5" y2="-8.5" stroke="#F6B40E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-8.5" y1="8.5" x2="-17" y2="17" stroke="#F6B40E" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Rayos ondulados (intermedios) -->
    <path d="M-6,-22 Q-4,-18 -6,-14" stroke="#F6B40E" stroke-width="1.8" stroke-linecap="round" fill="none" transform="rotate(22.5)"/>
    <path d="M-6,-22 Q-4,-18 -6,-14" stroke="#F6B40E" stroke-width="1.8" stroke-linecap="round" fill="none" transform="rotate(67.5)"/>
    <path d="M-6,-22 Q-4,-18 -6,-14" stroke="#F6B40E" stroke-width="1.8" stroke-linecap="round" fill="none" transform="rotate(112.5)"/>
    <path d="M-6,-22 Q-4,-18 -6,-14" stroke="#F6B40E" stroke-width="1.8" stroke-linecap="round" fill="none" transform="rotate(157.5)"/>
    <path d="M-6,-22 Q-4,-18 -6,-14" stroke="#F6B40E" stroke-width="1.8" stroke-linecap="round" fill="none" transform="rotate(202.5)"/>
    <path d="M-6,-22 Q-4,-18 -6,-14" stroke="#F6B40E" stroke-width="1.8" stroke-linecap="round" fill="none" transform="rotate(247.5)"/>
    <path d="M-6,-22 Q-4,-18 -6,-14" stroke="#F6B40E" stroke-width="1.8" stroke-linecap="round" fill="none" transform="rotate(292.5)"/>
    <path d="M-6,-22 Q-4,-18 -6,-14" stroke="#F6B40E" stroke-width="1.8" stroke-linecap="round" fill="none" transform="rotate(337.5)"/>

    <!-- Cara del sol -->
    <circle cx="0" cy="0" r="9" fill="#F6B40E"/>

    <!-- Ojos -->
    <circle cx="-3" cy="-1.5" r="1.2" fill="#1a1d2e"/>
    <circle cx="3" cy="-1.5" r="1.2" fill="#1a1d2e"/>

    <!-- Boca (sonrisa sutil) -->
    <path d="M-3,2.5 Q0,5 3,2.5" stroke="#1a1d2e" stroke-width="1" stroke-linecap="round" fill="none"/>
  </g>
</svg>
